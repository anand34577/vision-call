name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    name: scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          sh -n scripts/get.sh
          for f in scripts/*.sh deploy/*.sh; do bash -n "$f"; done
      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts, deploy -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors; exit 1 }
          }

  server:
    name: server (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: go vet
        working-directory: server
        run: go vet ./...
      - name: go build
        working-directory: server
        run: go build ./...
      - name: go test -race
        working-directory: server
        run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: end-to-end smoke test (multi-device sessions, 2FA, moderation)
        working-directory: server
        run: |
          DISABLE_TLS=true HTTP_ADDR= LISTEN_ADDR=127.0.0.1:18080 DATA_DIR="$(mktemp -d)" BOOTSTRAP_ADMIN_PASSWORD='AdminPass123!' go run ./cmd/server &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18080/api/healthz && break; sleep 1; done
          node ../scripts/e2e-sessions.mjs

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: build (includes tsc)
        working-directory: web
        run: npm run build

  android:
    name: android (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Compile Kotlin
        working-directory: android
        run: ./gradlew compileDebugKotlin --no-daemon
      - name: Build shrunk release (R8) so missing keep rules fail here, not on a phone
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

